<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'"
    />
    <title>FIIO Air Link Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <section class="startup" aria-label="Запуск FIIO Air Link Control">
        <div class="startup-monogram" aria-hidden="true">FALC</div>
        <div class="startup-copy">
          <h1>FIIO Air Link Control</h1>
          <div class="startup-progress" aria-hidden="true"><span></span></div>
          <div id="startup-status" class="startup-status">Initializing interface</div>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
