name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build portable executable
        run: python scripts/build_windows.py
      - name: Verify unsigned build output
        shell: pwsh
        run: |
          $exe = "release/FIIO-Air-Link-Control.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build output is missing" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne "NotSigned") {
            throw "CI build must remain unsigned; release signing has a separate trusted workflow"
          }
