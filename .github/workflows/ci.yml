name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build portable executable
        run: python scripts/build_windows.py
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "release/FIIO-Air-Link-Control.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build output is missing" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  FIIO-Air-Link-Control.exe" | Set-Content -Encoding ascii "release/FIIO-Air-Link-Control.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: FIIO-Air-Link-Control-${{ github.sha }}
          path: |
            release/FIIO-Air-Link-Control.exe
            release/FIIO-Air-Link-Control.exe.sha256
          if-no-files-found: error
