name: Signed Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected -and -not $env:GITHUB_REF_NAME.StartsWith("$expected-")) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }

      - name: Install dependencies
        run: python -m pip install -e ".[build]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build unsigned executable
        run: python scripts/build_windows.py

      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-FIIO-Air-Link-Control-${{ github.sha }}
          path: release/FIIO-Air-Link-Control.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign executable with SignPath
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800"
          output-artifact-directory: ${{ github.workspace }}\signed

      - name: Verify signature and create checksum
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -LiteralPath "signed" -Filter "FIIO-Air-Link-Control.exe" -File -Recurse)
          if ($matches.Count -ne 1) {
            throw "Expected one signed executable, found $($matches.Count)"
          }
          $exe = "release/FIIO-Air-Link-Control.exe"
          Copy-Item -LiteralPath $matches[0].FullName -Destination $exe -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne "Valid") {
            throw "Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.PublicKey.Oid.Value -ne "1.2.840.113549.1.1.1") {
            throw "Smart App Control requires an RSA signing certificate"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Authenticode signature has no trusted timestamp"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  FIIO-Air-Link-Control.exe" | Set-Content -Encoding ascii "release/FIIO-Air-Link-Control.exe.sha256"
          "SIGNED_EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-FIIO-Air-Link-Control-${{ github.ref_name }}
          path: |
            release/FIIO-Air-Link-Control.exe
            release/FIIO-Air-Link-Control.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "FIIO Air Link Control $tag"
          $assets = @(
            "release/FIIO-Air-Link-Control.exe",
            "release/FIIO-Air-Link-Control.exe.sha256"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release assets" }
          } else {
            $arguments = @(
              "release", "create", $tag,
              "--verify-tag",
              "--generate-notes",
              "--title", $title
            )
            if ($tag.Contains("-")) { $arguments += "--prerelease" }
            $arguments += $assets
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release" }
          }
