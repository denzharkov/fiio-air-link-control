name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match pyproject version)
        required: true
        default: v0.2.0-beta.2
        type: string
      prerelease:
        description: Mark as pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate source and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Releases must be created from the main branch"
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $expected = "v$version"
          if ($env:RELEASE_TAG -ne $expected -and -not $env:RELEASE_TAG.StartsWith("$expected-")) {
            throw "Tag $env:RELEASE_TAG does not match project version $version"
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing tags"
          }
          if ($existingTag) {
            throw "Tag $env:RELEASE_TAG already exists"
          }

      - name: Install dependencies
        run: python -m pip install -e ".[build]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable executable
        run: python scripts/build_windows.py
      - name: Verify build and create checksum
        shell: pwsh
        run: |
          $exe = "release/FIIO-Air-Link-Control.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build output is missing" }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned portable build"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  FIIO-Air-Link-Control.exe" | Set-Content -Encoding ascii "release/FIIO-Air-Link-Control.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FIIO-Air-Link-Control-${{ inputs.tag }}
          path: |
            release/FIIO-Air-Link-Control.exe
            release/FIIO-Air-Link-Control.exe.sha256
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $title = "FIIO Air Link Control $env:RELEASE_TAG"
          $notes = @"
          Portable Windows build. Python installation is not required.

          > [!NOTE]
          > This community build is unsigned. Microsoft SmartScreen may display a warning on first launch.
          "@
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "release/FIIO-Air-Link-Control.exe",
            "release/FIIO-Air-Link-Control.exe.sha256",
            "--target", $env:GITHUB_SHA,
            "--title", $title,
            "--generate-notes",
            "--notes", $notes
          )
          if ($env:PRERELEASE -eq "true") { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release" }
          gh release view $env:RELEASE_TAG --json url,tagName,isPrerelease
