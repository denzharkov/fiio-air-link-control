name: Microsoft Store Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[build]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Store MSIX
        run: >-
          python scripts/build_msix.py --store
          --identity-file packaging/store_identity.json
      - name: Upload Store package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FIIO-Air-Link-Control-Store-${{ github.sha }}
          path: release/*.msix
          if-no-files-found: error
