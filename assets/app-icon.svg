<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FIIO Air Link Control application icon</title>
  <desc id="desc">A wired plug entering an Air Link adapter with a wireless signal leaving it.</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172229"/>
      <stop offset="0.58" stop-color="#0E161A"/>
      <stop offset="1" stop-color="#090E11"/>
    </linearGradient>
    <linearGradient id="accent" x1="208" y1="144" x2="310" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AFFD2"/>
      <stop offset="0.52" stop-color="#66EFB5"/>
      <stop offset="1" stop-color="#42C996"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#background)"/>
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="#38505A" stroke-width="2"/>

  <!-- Wired input. -->
  <path d="M130 256H211" stroke="#EEF6F7" stroke-width="20" stroke-linecap="round"/>
  <rect x="68" y="222" width="70" height="68" rx="13" fill="#EEF6F7"/>
  <path d="M68 238H50V274H68" fill="none" stroke="#8EA1AA" stroke-width="14" stroke-linejoin="round"/>

  <!-- Air Link adapter. -->
  <rect x="202" y="137" width="112" height="238" rx="39" fill="#11191E" stroke="url(#accent)" stroke-width="18"/>
  <path d="M238 177H278" stroke="#D7FFEC" stroke-width="10" stroke-linecap="round"/>
  <circle cx="258" cy="331" r="10" fill="#66EFB5"/>

  <!-- Wireless output. -->
  <path d="M344 206C377 233 377 279 344 306" fill="none" stroke="#66EFB5" stroke-width="18" stroke-linecap="round"/>
  <path d="M382 169C440 215 440 297 382 343" fill="none" stroke="#66EFB5" stroke-width="18" stroke-linecap="round" opacity="0.58"/>
</svg>
